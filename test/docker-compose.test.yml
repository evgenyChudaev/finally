# Test-only stack for FinAlly E2E. Brings up the prebuilt `finally:latest` image with
# LLM_MOCK=true and a tmpfs-backed /app/db so every `compose up -d` starts with a
# fresh, deterministic database. Playwright runs on the HOST (not in a container).
services:
  app:
    image: finally:latest
    container_name: finally-e2e
    ports:
      - "8000:8000"
    environment:
      - LLM_MOCK=true
      - OPENROUTER_API_KEY=mock-key-not-used
      - LOG_LEVEL=info
      # DEFAULT_WATCHLIST left unset → uses the built-in 10-ticker default seed
      - DB_PATH=/app/db/finally.db
    tmpfs:
      # Ephemeral DB — wiped on every `compose down`
      - /app/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status == 200 else 1)"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
